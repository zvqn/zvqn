<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f5" stop-opacity="0"/>
      <stop offset="1" stop-color="#f5f5f5" stop-opacity="1"/>
    </linearGradient>
  </defs>
  
  <rect width="880" height="200" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="879" height="199" fill="none" stroke="#2a2a2a"/>
  
  <g fill="#f5f5f5">
    <circle cx="520" cy="28" r="0.8" opacity="0.35"/>
    <circle cx="610" cy="150" r="0.8" opacity="0.25"/>
    <circle cx="700" cy="60" r="1" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="130" r="0.8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="35" r="0.8" opacity="0.3"/>
  </g>
  
  <g opacity="0" transform="translate(430,-20)">
    <line x1="0" y1="0" x2="60" y2="24" stroke="url(#trail)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="60" cy="24" r="1.4" fill="#f5f5f5"/>
    <animateTransform attributeName="transform" type="translate"
      values="430,-20; 730,100; 730,100" keyTimes="0;0.25;1"
      dur="5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.03;0.25;0.26;1"
      dur="5s" begin="0.5s" repeatCount="indefinite"/>
  </g>
  
  <g opacity="0" transform="translate(620,-30)">
    <line x1="0" y1="0" x2="50" y2="20" stroke="url(#trail)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="50" cy="20" r="1.2" fill="#f5f5f5"/>
    <animateTransform attributeName="transform" type="translate"
      values="620,-30; 920,90; 920,90" keyTimes="0;0.22;1"
      dur="6.5s" begin="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.03;0.22;0.23;1"
      dur="6.5s" begin="2.2s" repeatCount="indefinite"/>
  </g>
  
  <g opacity="0" transform="translate(300,-40)">
    <line x1="0" y1="0" x2="40" y2="16" stroke="url(#trail)" stroke-width="1" stroke-linecap="round"/>
    <circle cx="40" cy="16" r="1" fill="#f5f5f5"/>
    <animateTransform attributeName="transform" type="translate"
      values="300,-40; 560,64; 560,64" keyTimes="0;0.2;1"
      dur="8s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0;0;0" keyTimes="0;0.03;0.2;0.21;1"
      dur="8s" begin="4s" repeatCount="indefinite"/>
  </g>

  <text x="40" y="95" font-family="ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#f5f5f5">Ven (zvqn)</text>
  <text x="40" y="130" font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="3" fill="#8a8a8a">REACT · TYPESCRIPT · LUAU</text>
  <rect x="40" y="148" width="8" height="14" fill="#f5f5f5">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
